name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Format, types, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npm run test:types
        working-directory: backend
      # Pure functions, no database: they fail fast here instead of waiting
      # for the API job's Postgres.
      - run: npm run test:unit
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  api-tests:
    name: API tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bunkbuddy
          POSTGRES_PASSWORD: bunkbuddy
          POSTGRES_DB: bunkbuddy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bunkbuddy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Same shape as a local backend/.env.test (see README). The database
      # only lives for this job, so its credentials aren't secrets.
      - run: |
          cat > .env.test <<'EOF'
          DATABASE_URL=postgresql://bunkbuddy:bunkbuddy@localhost:5432/bunkbuddy_test
          JWT_SECRET=ci-test-secret
          PORT=4001
          NODE_ENV="test"
          EOF
      # Both projects, so the report counts what the unit and API tests
      # cover together. Fails if coverage drops below the thresholds in
      # vitest.config.ts.
      - run: npm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            console.log("### Backend coverage");
            console.log("");
            console.log("| | % | covered |");
            console.log("| --- | --- | --- |");
            for (const k of ["statements", "branches", "functions", "lines"])
              console.log(`| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`);
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

  e2e:
    name: End-to-end tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One job per browser engine; the phone profiles run on the engine they
    # emulate (Pixel 7 on Chromium, iPhone 14 on WebKit).
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: --project=chromium --project=pixel-7
          - browser: firefox
            projects: --project=firefox
          - browser: webkit
            projects: --project=webkit --project=iphone-14
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bunkbuddy
          POSTGRES_PASSWORD: bunkbuddy
          POSTGRES_DB: bunkbuddy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bunkbuddy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      # Same shape as a local backend/.env.e2e (see README).
      - run: |
          cat > .env.e2e <<'EOF'
          DATABASE_URL="postgresql://bunkbuddy:bunkbuddy@localhost:5432/bunkbuddy?schema=e2e"
          JWT_SECRET=ci-e2e-secret
          PORT=4002
          NODE_ENV="test"
          EOF
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: frontend
      - run: npx playwright test ${{ matrix.projects }}
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results-${{ matrix.browser }}
          path: frontend/test-results/
          retention-days: 14
